name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload assets to the release

jobs:
  release:
    name: Build and attach binary
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.25

    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build
      run: make build

    - name: Package binary as zip
      run: zip wsl2-ssh-pageant.exe.zip wsl2-ssh-pageant.exe

    - name: Attach zip to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$RELEASE_TAG" wsl2-ssh-pageant.exe.zip --clobber
