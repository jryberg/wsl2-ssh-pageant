name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload assets to the release

jobs:
  release:
    name: Build and attach binary
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: 1.25

    - name: Check out code into the Go module directory
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build
      run: make build

    - name: Package binary as zip
      run: zip wsl2-ssh-pageant.exe.zip wsl2-ssh-pageant.exe

    - name: Attach zip to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$RELEASE_TAG" wsl2-ssh-pageant.exe.zip --clobber
